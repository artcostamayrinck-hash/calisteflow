  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Conteúdo para navegadores e crawlers sem JavaScript -->
    <noscript>
      <div style="max-width: 680px; margin: 40px auto; padding: 24px; background: #0f172a; border-radius: 16px; border: 1px solid #1e293b; font-family: system-ui, sans-serif; color: #f8fafc;">
        <h1 style="color: #10b981; margin-bottom: 8px;">CalisteFlow • Calistenia & Postura Biomecânica</h1>
        <p style="color: #94a3b8; font-size: 15px; line-height: 1.6;">
          O CalisteFlow é um aplicativo mobile-first e 100% offline projetado para treinos guiados de calistenia, peso corporal, progressões ginásticas e correção postural.
        </p>
        <div style="margin: 20px 0; padding: 16px; background: #1e293b; border-radius: 12px; border-left: 4px solid #10b981;">
          <h3 style="margin-top: 0; font-size: 16px;">Para utilizar o aplicativo completo:</h3>
          <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 0;">
            Por favor, habilite o JavaScript no seu navegador. O CalisteFlow funciona diretamente no seu aparelho (local-first) sem enviar dados para servidores externos.
          </p>
        </div>
        <h2 style="font-size: 18px; margin-top: 24px;">Diretrizes de Segurança & Isenção Médica:</h2>
        <ul style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
          <li>Interrompa imediatamente qualquer exercício ao sinal de dor aguda ou pontadas articulares.</li>
          <li>Respeite o descanso prescrito e nunca treine com desconforto em tendões.</li>
          <li>Este aplicativo não substitui orientação médica ou profissional de Educação Física habilitado (CREF).</li>
        </ul>
      </div>
    </noscript>

    <!-- Shell de carregamento inicial (Splash/Skeleton) substituído pelo React -->
    <div id="root">
      <div id="app-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 68px; height: 48px; margin-bottom: 20px;">
          <img src="./assets/img/logo-512.png?v=4" alt="CalisteFlow" width="68" height="48" style="width: auto; height: 48px; object-fit: contain;" />
        </div>
        <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.025em; color: #f8fafc;">Caliste<span style="color: #18eeff;">Flow</span></span>
        <span style="font-size: 12px; font-weight: 600; color: #64748b; margin-top: 6px; letter-spacing: 0.05em; text-transform: uppercase;">Carregando ambiente offline...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
